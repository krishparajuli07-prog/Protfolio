# Template rendered by scripts/generate-headers.mjs for the configured BASE_PATH.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_vary on;
  include /etc/nginx/headers.conf;

  location /__health { return 204; }
  location = __BASE__/_headers { return 404; }
  location ~ /\. { return 404; }
  location ^~ __BASE__/.well-known/ { try_files $uri =404; }
  location __BASE__/_astro/ {
    include /etc/nginx/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ =404; }
  error_page 404 __BASE__/404.html;
}
