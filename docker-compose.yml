name: portfolio
services:
  dev:
    image: node:22.12.0-alpine3.20@sha256:027911463b296bdaf6df82b5ccf2c6b290fee725d5fba6513a037ed019400625
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '4321:4321'
    command:
      ['sh', '-c', 'npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 4321']
    profiles: ['dev']

  prod:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
        BASE_PATH: ${BASE_PATH:-}
    ports:
      - '${PROD_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: '101'
    profiles: ['prod']

  # Serve an existing artifact without rebuilding or contacting a registry for the site.
  static:
    image: nginxinc/nginx-unprivileged:1.27.3-alpine3.20@sha256:9e7238f579a54582263a960d1b0094b4a3ecce641342eda3f8e2ff82b1703d2b
    volumes:
      - ./dist:/usr/share/nginx/html${BASE_PATH:-}:ro
      - ./deploy/generated/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/docker/headers.conf:/etc/nginx/headers.conf:ro
    ports:
      - '${PROD_PORT:-8080}:8080'
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    user: '101'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/__health]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles: ['static']

  # Alternative runtime serving the same artifact.
  caddy:
    build:
      context: deploy/docker
      dockerfile: Caddy.Dockerfile
    volumes:
      - ./dist:/srv${BASE_PATH:-}:ro
      - ./deploy/generated/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/docker/headers.caddy:/etc/caddy/headers.caddy:ro
    ports:
      - '${PROD_PORT:-8080}:8080'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: '100:101'
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/__health]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles: ['caddy']

  ci:
    image: node:22.12.0-alpine3.20@sha256:027911463b296bdaf6df82b5ccf2c6b290fee725d5fba6513a037ed019400625
    working_dir: /app
    volumes:
      - .:/app
    command:
      [
        'sh',
        '-c',
        'npm ci --no-audit --no-fund && npm run validate && npm run typecheck && npm run build && npm run check:links'
      ]
    profiles: ['ci']
