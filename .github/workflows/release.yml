name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: [self-hosted, linux, debian]
    steps:
      - uses: googleapis/release-please-action@046d51c1f3b1793d83cc8cf7b3b44f876eacab4d8 # v4.2.0
        with:
          release-type: node
