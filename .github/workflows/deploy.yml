name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cloudflare: ${{ steps.targets.outputs.cloudflare }}
      vercel: ${{ steps.targets.outputs.vercel }}
      netlify: ${{ steps.targets.outputs.netlify }}
      pages: ${{ steps.targets.outputs.pages }}
      debian: ${{ steps.targets.outputs.debian }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: targets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          VC_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VC_ORG: ${{ secrets.VERCEL_ORG_ID }}
          VC_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
          NL_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NL_SITE: ${{ secrets.NETLIFY_SITE_ID }}
          PUBLIC_SITE: ${{ vars.SITE_URL }}
          PAGES: ${{ vars.ENABLE_GITHUB_PAGES }}
          DEBIAN: ${{ vars.ENABLE_DEBIAN_DEPLOY }}
        run: node scripts/deployment-targets.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm run check:links && npm run deploy:prepare && npm run test:portability
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://krishparajuli.com.np' }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-site
          include-hidden-files: true
          path: |
            dist/
            deploy/generated/
            deploy/docker/
            deploy/vercel/.vercel/output/
            deploy/README.md
  debian:
    needs: build
    if: needs.build.outputs.debian == 'true'
    runs-on: [self-hosted, linux, debian]
    timeout-minutes: 15
    environment: production-debian
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      BASE_PATH: ${{ vars.BASE_PATH }}
      PROD_PORT: ${{ vars.PROD_PORT || '8080' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: static-site
      - name: Build the runtime image from the validated artifact
        run: docker compose -f deploy/self-hosted/compose.yml build
      - name: Deploy and wait for a healthy website
        run: docker compose -f deploy/self-hosted/compose.yml up -d --wait --wait-timeout 90
      - name: Show deployment status
        if: always()
        run: |
          docker compose -f deploy/self-hosted/compose.yml ps
          docker compose -f deploy/self-hosted/compose.yml logs --tail=50
  cloudflare:
    needs: build
    if: needs.build.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    environment: production-cloudflare
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: static-site
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.145.0'
          command: pages deploy deploy/generated/publish --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=main
  vercel:
    needs: build
    if: needs.build.outputs.vercel == 'true'
    runs-on: ubuntu-latest
    environment: production-vercel
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: static-site
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: npx --yes vercel@62.0.0 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
        working-directory: deploy/vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  netlify:
    needs: build
    if: needs.build.outputs.netlify == 'true'
    runs-on: ubuntu-latest
    environment: production-netlify
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: static-site
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: npx --yes netlify-cli@27.10.2 deploy --dir deploy/generated/publish --prod --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  github-pages:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: static-site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: publish
